# dsh-memory bundle patch: inserts the dual-face plugin row into a profile's
# layer stack. Applied as a profile bundle layer (the `dsh.bundle.patch`
# manifest field) over dsh-base; activate with
# `dsh plugin --profile <name> add dsh-memory` (npm) or
# `dsh plugin --profile <name> add github:<owner>/<repo>` (monorepo).
#
# The row is a bare plugin by package name: the node half (exports ".") runs
# in the host process (memory file routes /api/dsh-memory), and the
# `dsh.client` declaration in package.json makes the browser half
# (exports "./client") load in the web GUI.
- insert:
    - id: memory
      name: 'dsh-memory'
