# dsh-new-session-route bundle patch: inserts the plugin into a profile's layer
# stack. Applied as a profile bundle layer (the `dsh.bundle.patch` manifest
# field) over dsh-base; activate with `dsh plugin --profile <name> add
# dsh-new-session-route` (npm) or the monorepo link path.
#
# The row is a bare plugin by package name: the host half (exports ".") is a
# no-op, and the `dsh.client` declaration in package.json makes the browser
# half (exports "./client") load in the web GUI, where it hooks the new-session
# button and offers the route dropdown.
- insert:
    - id: new-session-route
      name: 'dsh-new-session-route'
