name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [20, 22]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - name: Syntax check
        run: |
          node --check packages/dsh-agent-driver/lib/index.js
          node --check packages/dsh-agent-driver/lib/client.js
          node --check packages/dsh-chat-scroll-nav/lib/client.js
          node --check packages/dsh-desktop-pet/lib/client.js
          node --check packages/dsh-session-archive/lib/client.js
      - name: Smoke tests (sandboxed HOME, no real ~/.dsh needed)
        run: |
          cd packages/dsh-agent-driver && npm test
          cd ../dsh-session-archive && npm test
